  notes: 'The Lean development was written entirely by the AI system inside the benchmark harness. Humans (Thomas
    F. Bloom) selected the problem and reviewed the formal statement for faithfulness before the run; humans (Tom
    Adamczewski) ran the harness and, after the run, packaged the verified output into this repository. The only
    edits to the AI-written files are mechanical and are listed in the README: port to Mathlib v4.28.0: Mathlib
    v4.28.0 changed the field `SimpleGraph.loopless` from `Irreflexive Adj` to the class `Std.Irrefl Adj`, so proofs
    of that field need a `constructor` step (or an anonymous-constructor wrapper) and uses of `G.loopless` as a
    function become `G.loopless.irrefl`. Changed lines:; removed the sorry''d stub of the original conjecture `erdos_74`
    (lines 57–65 of the original) together with its docstring; restated `Erdos74.erdos_74.disproof` explicitly (the
    original used `¬ (type_of% @Erdos74.erdos_74)`, which referenced the removed stub) and added a docstring.'
fidelity:
  divergences: 'The compared theorem is exactly the negation of the Formal Conjectures statement. Points a reader
    should be aware of: (1) `f : ℕ → ℕ` is integer-valued and `Tendsto f atTop atTop` is the formal sense of `f(n)
    → ∞`; (2) the graph ranges over `SimpleGraph V` for a vertex type `V` in an arbitrary universe `u`, and the
    theorem is universe-polymorphic; (3) `maxSubgraphEdgeDistToBipartite G n` is the supremum over *all* (not only
    induced) `n`-vertex subgraphs of the minimum number of edge deletions making the subgraph bipartite — since
    edge deletion distance is monotone in the edge set, this agrees with the maximum over induced subgraphs; it
    uses `sSup` on `ℕ`, which is `0` for the empty set (graphs with fewer than `n` vertices), and `sInf`, whose
    argument set is always nonempty; (4) `G.chromaticNumber = ⊤` is Mathlib''s formalisation of infinite chromatic
    number. The formal statement asserts only existence of some `f → ∞`; the Lean proofs construct explicit budgets
    but no growth rate is advertised.'
