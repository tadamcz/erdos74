name = "Erdos74"
version = "0.1.0"
defaultTargets = ["Erdos74", "Erdos74Alternates", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# The primary resolution: `Erdos74.lean` imports it, and `Solution.lean` imports it in turn.
[[lean_lib]]
name = "Erdos74"

# Further independent resolutions of the same statement. Each is a self-contained copy of the
# benchmark statement followed by its own proof, so they are built separately and never imported
# together (they would clash on the shared declaration names).
[[lean_lib]]
name = "Erdos74Alternates"
roots = ["Erdos74.Resolutions.Erdos74_25usd_5h", "Erdos74.Resolutions.Erdos74_46usd_6h", "Erdos74.Resolutions.Erdos74_81usd_13h", "Erdos74.Resolutions.Erdos74_99usd_17h", "Erdos74.Resolutions.Erdos74_146usd_19h"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
