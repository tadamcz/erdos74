status:
  scope: 'Fully formalized: the compared theorem `Erdos74.erdos_74.disproof` in `Challenge.lean` is proved in `Solution.lean`
    via the imported module `Erdos74.Resolutions.Erdos74_118usd_22h` with no `sorry` and no axioms beyond propext,
    Quot.sound and Classical.choice. The 5 further module(s) in `Erdos74/Resolutions/` are independent complete
    proofs of the same statement, built as the separate Lake library `Erdos74Alternates` but not compared by Comparator.
    Only the negation of the formal conjecture is advertised; the stronger facts visible in the proofs (for example
    explicit budgets or 3-colourability) are not part of the compared statement. Nothing about the informal problem
    was omitted or weakened relative to the benchmark''s formal statement; see fidelity.divergences for the relation
    between that formal statement and the informal problem.'
